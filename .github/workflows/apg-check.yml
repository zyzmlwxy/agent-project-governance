name: APG basic checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify governance files and secret directory exclusion
        shell: bash
        run: |
          test -f AGENTS.md
          test -f docs/AI_HANDOFF.md
          test -f docs/PROJECT_STATUS.md
          test -f .agent/SECURITY.md
          test -f .agent/GIT_SOURCE_OF_TRUTH.md
          if git ls-files .agent-local/ | grep .; then
            echo 'ERROR: private local directory tracked'
            exit 1
          fi
